<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 로컬 인증 설정</title><style>body{font:16px/1.55 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;color:#172b46}h1{font-size:24px}p{color:#586678}label{display:block;font-weight:700;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #a8b4c4;border-radius:6px;font:inherit}button{margin-top:12px;padding:10px 16px;border:0;border-radius:6px;background:#12375b;color:white;font:inherit;font-weight:700}#status{margin-top:16px;white-space:pre-wrap}</style><h1>응급의료 API 인증키 설정</h1><p>키는 이 컴퓨터의 로컬 대시보드 서버로만 전송되고, 프로젝트의 .env 파일에 권한 600으로 저장됩니다. 저장 후 입력칸은 지워집니다.</p><form id="f"><label for="serviceKey">일반 인증키</label><input id="serviceKey" type="password" autocomplete="off" required minlength="32"><button>저장 후 API 연결 확인</button></form><p id="status" role="status"></p><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const i=document.getElementById('serviceKey'),s=document.getElementById('status'),k=i.value;s.textContent='로컬 저장 후 승인된 API에 연결 중…';try{const r=await fetch('/api/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceKey:k})});const d=await r.json();i.value='';if(d.ok)s.textContent='인증키 저장 및 API 연결 성공 · '+d.count+'개 기관';else s.textContent=(d.saved?'인증키는 저장됐지만 API 연결 오류: ':'설정 오류: ')+(d.error||'확인 필요');}catch(e){i.value='';s.textContent='로컬 서버 연결에 실패했습니다.'}});</script></html>
